name: Bioconductor-CMD-check

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  bioc-check:
    runs-on: ${{ matrix.os }}

    name: ${{ matrix.os }} (R ${{ matrix.r }} / Bioc ${{ matrix.bioc }})

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
        r: ['4.3.0']
        bioc: ['3.18']

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      # Linux uses Bioconductor Docker image
      - name: Set up Bioconductor Docker (Linux only)
        if: runner.os == 'Linux'
        uses: docker://bioconductor/bioconductor_docker:RELEASE_3_18

      # macOS + Windows use r-lib/actions
      - name: Set up R
        if: runner.os != 'Linux'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: false
          extra-repositories: |
            https://bioconductor.org/packages/${{ matrix.bioc }}/bioc
            https://bioconductor.org/packages/${{ matrix.bioc }}/data/annotation
            https://bioconductor.org/packages/${{ matrix.bioc }}/data/experiment
            https://bioconductor.org/packages/${{ matrix.bioc }}/workflows

      - name: Set up pandoc
        if: runner.os != 'Linux'
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install BiocManager
        run: install.packages("BiocManager")
        shell: Rscript {0}

      - name: Install Bioconductor core + annotation packages
        run: |
          BiocManager::install(version = "${{ matrix.bioc }}", ask = FALSE)
          BiocManager::install(c(
            "GO.db",
            "AnnotationDbi",
            "org.Hs.eg.db",
            "org.Mm.eg.db",
            "org.Dm.eg.db"
          ))
        shell: Rscript {0}

      - name: Install orthogene (>=1.8.0)
        run: |
          BiocManager::install("orthogene", ask = FALSE)
        shell: Rscript {0}

      - name: Install package dependencies
        run: |
          install.packages("remotes")
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}

      - name: Install TMEM
        run: R CMD INSTALL .
        shell: bash

      - name: Run R CMD check
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: '"error"'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
